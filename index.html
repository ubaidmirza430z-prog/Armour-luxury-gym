<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armour Luxury Gym – High-Performance Luxury Fitness</title>
    <meta
      name="description"
      content="Official digital foundation for Armour Luxury Gym. An architectural sanctum dedicated to strength, human performance, and refined athletic aesthetics."
    />

    <!-- Favicon: AL Monogram SVG in Gold -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23080808'/%3E%3Crect x='1' y='1' width='30' height='30' rx='3' fill='none' stroke='%23D4AF37' stroke-width='1' opacity='0.7'/%3E%3Ctext x='16' y='21' font-family='serif' font-size='14' font-weight='bold' fill='%23D4AF37' text-anchor='middle'%3EAL%3C/text%3E%3C/svg%3E"
    />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Armour Luxury Gym – High-Performance Luxury Fitness" />
    <meta
      property="og:description"
      content="Official digital foundation for Armour Luxury Gym. An architectural sanctum dedicated to strength, human performance, and refined athletic aesthetics."
    />
    <meta property="og:site_name" content="Armour Luxury Gym" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Armour Luxury Gym – High-Performance Luxury Fitness" />
    <meta
      name="twitter:description"
      content="Official digital foundation for Armour Luxury Gym. An architectural sanctum dedicated to strength, human performance, and refined athletic aesthetics."
    />

    <!-- Google Fonts Preconnect & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD): ExerciseGym / LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ExerciseGym",
        "name": "Armour Luxury Gym",
        "description": "An architectural sanctum dedicated to strength, human performance, and refined athletic conditioning.",
        "image": "",
        "telephone": "[PHONE NUMBER]",
        "priceRange": "₹₹₹",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[GYM ADDRESS]",
          "addressLocality": "[CITY]",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "05:30",
            "closes": "23:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday", "Sunday"],
            "opens": "07:00",
            "closes": "21:00"
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#080808] text-white selection:bg-[#D4AF37] selection:text-black antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
